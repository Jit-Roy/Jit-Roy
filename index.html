<body>
    <main>
        <h1 class="sr-only">EXPLORER-1 remote shell. An interactive story terminal.</h1>
        <noscript>This page is an interactive terminal and needs JavaScript to run.</noscript>
        <div id="t">
            <div id="hd"><span>REMOTE SHELL // EXPLORER-1</span><span id="sig"></span><span id="bat">TX <span
                        id="batbar"><span id="batfill"></span></span><span id="batnum">02%</span></span></div>
            <div id="out" aria-live="polite"></div>
            <div id="row"><span id="pr">earth@explorer-1:~$</span><input id="in" type="text" autocomplete="off"
                    autocapitalize="off" spellcheck="false" aria-label="Terminal input" placeholder="try: ls"></div>
        </div>
    </main>
    <script>
        var out = document.getElementById('out'), inp = document.getElementById('in'), prEl = document.getElementById('pr');
        var hist = [], hi = 0, Q = [], running = false, fast = false, done = false, nCmd = 0, nHints = 0;
        var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------- progression state ----------
           st.p is the story stage (2-7), never shown to the player. Stages advance only when the player
           performs a concrete action (recharge, scan, follow, connect, descend, unlock, prompt, maint, recover).
           Reading files is never required, but the right file is always what tells you the right argument. */
        function newSt() { return { p: 2, parged: false, keySeen: false, sent: false, below: false, mission: false, netFound: false, pcapDone: false, trainDone: false, exploited: false, forensicsDone: false, ended: false, n0: 0 } }
        function newHL() { return { power: 0, key: 0, network: 0, pcap: 0, connect: 0, below: 0, mission: 0, train: 0, service: 0, forensics: 0, end: 0 } }
        var st = newSt(), HL = newHL();

        var GC = '▒░#%/\\|:;*?&@';
        function rc() { return GC[Math.floor(Math.random() * GC.length)] }
        function corrupt(t, all) { var s = ''; for (var j = 0; j < t.length; j++) { var c = t[j]; s += (c === ' ' || c === '\n') ? c : ((all || Math.random() < 0.45) ? rc() : c) } return s }
        function L(t, c, d) { return { t: t, c: c, d: d } }
        function S(t, c, d) { return { s: t, c: c, d: d == null ? 300 : d } }
        function H(h, d) { return { h: h, d: d } }
        function F(f, d) { return { fn: f, d: d == null ? 0 : d } }
        function sp() { return L('', '', 60) }
        function G() { return L(corrupt('xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', 1), 'g', 90) }
        function setLink(s) { var m = { SEARCHING: ['e', '░░░░'], RETRYING: ['w', '▂░░░'], UNSTABLE: ['w', '▂▄░░'], WEAK: ['w', '▂░░░'], LOCKED: ['k', '▂▄▆█'], LOST: ['e', '░░░░'] }; var e = document.getElementById('sig'); e.className = m[s][0]; e.textContent = 'LINK: ' + s + ' ' + m[s][1] }
        function setBat(n) { st.bat = n; var f = document.getElementById('batfill'); f.style.width = Math.max(0, n) + '%'; f.style.background = n >= 20 ? 'var(--text-success)' : 'var(--text-danger)'; document.getElementById('batnum').textContent = (n < 10 ? '0' : '') + n + '%' }
        function scr(el, txt) {
            if (fast || RM) { el.textContent = txt; return 0 }
            var n = txt.length, steps = Math.min(26, Math.max(10, Math.round(n / 4))), k = 0;
            el.textContent = corrupt(txt, 1);
            var iv = setInterval(function () { k++; var cut = Math.floor(n * k / steps); el.textContent = txt.slice(0, cut) + corrupt(txt.slice(cut), 1); out.scrollTop = out.scrollHeight; if (k >= steps) { clearInterval(iv); el.textContent = txt } }, 50);
            return steps * 50 + 120
        }
        function emit(i) {
            var el = document.createElement('div'), extra = 0;
            if (i.c !== undefined) el.className = i.c;
            if (i.h !== undefined) el.innerHTML = i.h;
            else if (i.s !== undefined) extra = scr(el, i.s);
            else el.textContent = i.t;
            out.appendChild(el); out.scrollTop = out.scrollHeight;
            return extra
        }
        function pump() {
            running = true;
            if (!Q.length) { running = false; fast = false; return }
            var i = Q.shift(), quick = fast || RM, d = quick ? 0 : (i.d == null ? 70 : i.d);
            setTimeout(function () {
                var extra = 0;
                if (i.fn) { var r = i.fn(); if (Array.isArray(r)) Q.unshift.apply(Q, r) } else extra = emit(i);
                setTimeout(pump, (fast || RM) ? 0 : extra)
            }, d)
        }
        function say(a) { a.forEach(function (i) { Q.push(i) }); if (!running) pump() }

        /* ---------- the civilization's last recording (simple shift cipher - their "hello") ---------- */
        var KEY = 'FIRST-HELLO-ERID';
        var FINAL = ["Hello, Earth.", "We heard you before you heard us.", "For a long time we only listened.", "Your explorer spoke to the lattice each night, and we learned Your words.", "You are never alone here.", "", "Take our greeting, this will open the door:", "", "KEY: " + KEY, "", "- the Lattice"].join('\n');
        function rotF(t, n) { n = ((n % 26) + 26) % 26; return t.replace(/[a-z]/gi, function (c) { var b = c < 'a' ? 65 : 97; return String.fromCharCode((c.charCodeAt(0) - b + n) % 26 + b) }) }
        function toBin(t) { var g = [], l = [], i; for (i = 0; i < t.length; i++)g.push(('00000000' + t.charCodeAt(i).toString(2)).slice(-8)); for (i = 0; i < g.length; i += 7)l.push(g.slice(i, i + 7).join(' ')); return l.join('\n') }
        function pulse(t) { return toBin(rotF(t, 3)) }
        function toHex(t) { var o = ''; for (var i = 0; i < t.length; i++)o += ('0' + t.charCodeAt(i).toString(16)).slice(-2); return o }

        /* ---------- 1987-era weak stream cipher (5-bit LFSR, taps at bits 0 and 2) ---------- */
        function lfsrBits(seed, nBits) { var reg = seed & 0x1F; if (!reg) reg = 1; var bits = []; for (var i = 0; i < nBits; i++) { bits.push(reg & 1); var fb = ((reg) ^ (reg >> 2)) & 1; reg = (reg >> 1) | (fb << 4) } return bits }
        function lfsrXor(text, seed) { var bits = lfsrBits(seed, text.length * 8), out = ''; for (var i = 0; i < text.length; i++) { var kb = 0; for (var j = 0; j < 8; j++) kb |= bits[i * 8 + j] << j; out += String.fromCharCode(text.charCodeAt(i) ^ kb) } return out }
        var MISSION_SEED = 3; /* 1987 mod 31 - never shown to the player, only recovered by lfsr --crack */
        var CMDR_MSG = "the lattice is only a door. he is still below. tell my son to stop looking for me";

        /* ---------- the entity's channel: XOR with a repeating key, crackable from a known crib ---------- */
        var XKEY = 'ERID87';
        function xorRep(text, key) { var out = ''; for (var i = 0; i < text.length; i++)out += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length)); return out }

        /* ---------- a cheap but deterministic checksum, used the way sha256sum is used here ---------- */
        function shipHash(t) { var h1 = 0x811c9dc5 >>> 0, h2 = 0x9e3779b9 >>> 0; for (var i = 0; i < t.length; i++) { h1 = ((h1 ^ t.charCodeAt(i)) * 16777619) >>> 0; h2 = ((h2 + t.charCodeAt(i)) * 2654435761) >>> 0 } var hex = function (n) { return ('00000000' + (n >>> 0).toString(16)).slice(-8) }; return hex(h1) + hex(h2) + hex(h1 ^ h2) + hex(~h2) }

        /* ---------- filesystem ---------- */
        function D(o) { return { d: o } }
        function telemetryRaw() {
            var rows = [
                ['10:40:01', 'CELL-A', 'FAULT', 'CRACKED'], ['10:42:01', 'LATTICE', 'OK', '-'], ['10:44:01', 'CELL-B', 'OK', '-'],
                ['10:46:01', 'REACTOR', 'FAULT', 'SURGE'], ['10:48:01', 'LATTICE', 'OK', '-'], ['10:50:01', 'NODE-UNK', 'ACTIVE', 'UNDOCUMENTED'],
                ['10:52:01', 'CELL-A', 'FAULT', 'CRACKED'], ['10:54:01', 'LATTICE', 'OK', '-'], ['10:56:01', 'CELL-B', 'OK', '-'],
                ['10:58:01', 'REACTOR', 'FAULT', 'SURGE'], ['11:00:01', 'LATTICE', 'OK', '-'], ['11:02:01', 'CELL-A', 'FAULT', 'CRACKED'],
                ['11:04:01', 'NODE-UNK', 'ACTIVE', 'UNDOCUMENTED'], ['11:06:01', 'LATTICE', 'OK', '-'], ['11:08:01', 'CELL-B', 'OK', '-'],
                ['11:10:01', 'REACTOR', 'FAULT', 'SURGE'], ['11:12:01', 'LATTICE', 'OK', '-'], ['11:14:01', 'CELL-A', 'FAULT', 'CRACKED'],
                ['11:16:01', 'LATTICE', 'OK', '-'], ['11:18:01', 'NODE-UNK', 'ACTIVE', 'UNDOCUMENTED'], ['11:20:01', 'CELL-B', 'OK', '-'],
                ['11:22:01', 'REACTOR', 'FAULT', 'SURGE'], ['11:24:01', 'LATTICE', 'OK', '-'], ['11:26:01', 'CELL-A', 'FAULT', 'CRACKED']
            ];
            return rows.map(function (r) { return '0540.' + r[0] + ',' + r[1] + ',' + r[2] + ',' + r[3] }).join('\n')
        }
        function humSamples() {
            var n = 32, rate = 100, tone = 87, a = [];
            for (var i = 0; i < n; i++) a.push(Math.round(50 * Math.sin(2 * Math.PI * tone * i / rate) + 50));
            return a.join(',')
        }
        function pulsesRaw() {
            var word = 'WATCHERS', bits = [];
            for (var i = 0; i < word.length; i++) { var code = word.charCodeAt(i); for (var b = 7; b >= 0; b--)bits.push((code >> b) & 1) }
            return bits.map(function (bit, i) { return bit ? (88 + (i % 3)) : (9 + (i % 3)) }).join(',')
        }
        var pcapFrags = (function () { var m = 'SINCE 1987 WE LISTEN'; return [m.slice(0, 5), m.slice(5, 10), m.slice(10, 15), m.slice(15, 20)] })();
        function capturePcap() {
            var lines = [
                'SEQ=03 TTL=255 LEN=05 CRC=OK  TIME=1987-09-14T02:11:02Z DATA=' + toHex(pcapFrags[2]),
                'SEQ=01 TTL=255 LEN=05 CRC=OK  TIME=1987-09-14T02:11:00Z DATA=' + toHex(pcapFrags[0]),
                'SEQ=05 TTL=255 LEN=05 CRC=BAD TIME=1987-09-14T02:11:09Z DATA=' + toHex('%%garb'),
                'SEQ=02 TTL=255 LEN=05 CRC=OK  TIME=1987-09-14T02:11:01Z DATA=' + toHex(pcapFrags[1]),
                'SEQ=02 TTL=255 LEN=05 CRC=OK  TIME=1987-09-14T02:11:01Z DATA=' + toHex(pcapFrags[1]),
                'SEQ=04 TTL=255 LEN=05 CRC=OK  TIME=1987-09-14T02:11:03Z DATA=' + toHex(pcapFrags[3])
            ];
            return lines.join('\n')
        }
        var LOCKBYTES = [0x00, 0x02, 0x07, 0xC3, 0x03, 0x07, 0xE4, 0x04];
        function lockBin() { return LOCKBYTES.map(function (b) { return ('0' + b.toString(16)).slice(-2) }).join('') + toHex('LOCK-REV-A1987') }
        var FS = D({
            home: D({
                explorer: D({
                    'README.txt': ["EXPLORER-1 // ONBOARD COMPUTER // REMOTE SHELL", "", "To whoever is on Earth: you are reading this, so my first message arrived.", "", "That message was only the beginning. Everything else I recorded here is", "still on this machine, and I cannot push it to you myself. The transmitter", "only had enough left for a single burst, and I already spent it.", "", "So the rest is yours to pull. I left an archive queued in ship/comms/.", "It is locked, and the link cannot hold at 2% battery. In order:", "", "  1. Give the ship enough power to hold a connection.", "  2. Find the word that unlocks the archive. The civilization gave it to me.", "  3. Map the ship's own network. Something undocumented is drawing on it.", "  4. Open a channel that can carry the downlink.", "", "Everything you need is in this filesystem.", "Type \"help\" for commands. Read before you act."].join('\n'),
                    '.signal': ["You found the dotfile. Most people never look.", "", "Whoever you are, on whichever side of the distance:", "they are not dangerous. They are curious. Like us.", "", "Keep looking at the edges."].join('\n'),
                    '.shell_history': ["bin -d contact/pulse_001.sig        # nonsense. why is it all shifted?", "recharge cell-a --source solar      # nothing happened", "recharge cell-a --source reactor    # sparks, smell of burning", "cat logs/day-0204.log", "cat logs/day-0311.log", "connect --channel 1                 # static. only static.", "scan 10.19.88.4                     # unreachable. that array is gone.", "cat ship/network/leases.txt         # one address with no name"].join('\n'),
                    journal: D({
                        '01_departure.txt': ["I left Earth the way people leave a conversation they are sure will continue.", "", "Everyone asked what I was looking for.", "I never had a good answer. I only knew I could not stay where the map ended.", "", "Other people read the edge of a chart as a warning.", "I read it as an invitation nobody had bothered to sign."].join('\n'),
                        '02_arrival.txt': ["Erid is not what the survey said.", "", "The air is a thin violet haze of methane and ammonia. I have not taken", "my helmet off once, and I will not. No forests, no oceans, no birds.", "I set the lander down at the edge of the lattice fields: rows of tall", "crystalline lattices running to the horizon, each one humming faintly at", "the edge of hearing.", "", "At dusk small lights drift between the lattices, slowly, like they are", "tending them. I have started calling them lanterns.", "", "The sensors call the hum geology. Geology does not hum in tune."].join('\n'),
                        '03_first_contact.txt': ["Night 61. I sent a signal at the lattice, mostly out of boredom.", "It answered.", "", "Not with words. With pulses: long, short, long, long.", "I recorded all of it. I have not stopped recording since.", "", "The lanterns gathered around the nearest lattice while it replied.", "I do not think that was an accident."].join('\n'),
                        '04_understanding.txt': ["It took me months to find the pattern.", "", "Every reply comes back shifted, the same way, every time.", "At first I called it noise. Noise does not repeat itself on purpose.", "", "Once I wrote my side out as 0s and 1s, they began to copy the format back.", "Some small recordings so far. Hello. Who are you. They are learning me."].join('\n'),
                        '05_last_entry.txt': ["The archive is queued and the transmitter is nearly dead.", "", "I will keep talking to the lattice for as long as the battery lasts.", "Whoever you are, you have the whole ship now. The records are here, and a", "few things I could not make sense of myself. Perhaps you will understand", "more than I did.", "", "Thank you for answering."].join('\n')
                    }),
                    logs: D({
                        'day-0001.log': ["DAY 0001 | Arrived in high orbit, planet Erid. All systems nominal.", "DAY 0001 | Crew morale: high. Crew: one. Coffee: abundant."].join('\n'),
                        'day-0030.log': ["DAY 0030 | Set the lander down at the edge of the lattice fields.", "DAY 0030 | Atmosphere: methane and ammonia haze. Suit stays on. Ground is humming."].join('\n'),
                        'day-0061.log': ["DAY 0061 | The lattice answered my signal. Pulses, not words.", "DAY 0061 | Recording everything. I have not slept. I regret nothing."].join('\n'),
                        'day-0099.log': ["DAY 0099 | Wrote the first reply out as 0s and 1s. Long pulse is 1, short is 0.", "DAY 0099 | Every reply is shifted three letters forward. Always three. I think it is how they say hello."].join('\n'),
                        'day-0204.log': ["DAY 0204 | Ring debris. The solar array sheared clean off. Gone.", "DAY 0204 | The impact cracked cell-a. Do not charge cell-a again. Ever.", "DAY 0204 | Heater holding. Barely."].join('\n'),
                        'day-0311.log': ["DAY 0311 | Power surge. The reactor coupling cracked.", "DAY 0311 | Do NOT route anything through the reactor again. Noted, underlined, regretted.", "DAY 0311 | Cell-c feeds life support. I am not touching cell-c."].join('\n'),
                        'day-0398.log': ["DAY 0398 | Ran a network scan on a whim. There is an address on our own subnet", "DAY 0398 | with no lease, no name, nothing in the manifest. It answers a port scan.", "DAY 0398 | I do not know what put it there. It was not me."].join('\n'),
                        'day-0412.log': ["DAY 0412 | Quiet night. The lattice hums at the same pitch as my transmitter.", "DAY 0412 | It offered a tap. I do not know why. I did not refuse.", "DAY 0412 | Tapping the lattice works. Slow, but it works. Cell-b took the charge well."].join('\n'),
                        'day-0498.log': ["DAY 0498 | Sent the first message tonight. The battery fell to 2% afterwards.", "DAY 0498 | If Earth has it, Earth can reach this terminal. They will have to open the channel themselves.", "DAY 0498 | I cannot hold it open from here. The downlink needs 20% to stay up, and the archive will not release without the lattice's word."].join('\n'),
                        'day-0540.log': ["DAY 0540 | Archive queued in ship/comms/. Locked with the word they gave me.", "DAY 0540 | Channel check: not every channel is usable. See ship/comms/channels.txt.", "DAY 0540 | Earth is about sixteen light years away. A test ping should take thirty-two years round trip.", "DAY 0540 | It took four seconds. I do not think the transmitter is doing that. I have stopped asking.", "DAY 0540 | If someone is reading this, thank you for being here."].join('\n')
                    }),
                    contact: D({
                        'README.contact': ["CONTACT RECORDINGS // EXPLORER-1", "", "These are the pulses I recorded at the lattice. Five recordings, in order.", "final.sig is the last and the longest. It came the night before the", "transmitter began to fail.", "", "I have not decoded any of them to my satisfaction.", "My notes are in lexicon.txt."].join('\n'),
                        'lexicon.txt': ["LEXICON (incomplete)", "", "Pulse format: long = 1, short = 0. Eight pulses make one character.", "Every recording is written out as 0s and 1s.", "", "Every reply comes back with its letters shifted. The shift is always the same.", "See logs to get more info."].join('\n'),
                        'pulse_001.sig': pulse('hello'),
                        'pulse_002.sig': pulse('who are you'),
                        'pulse_003.sig': pulse('you are far from home'),
                        'pulse_004.sig': pulse('we are listening'),
                        'final.sig': pulse(FINAL)
                    }),
                    ship: D({
                        power: D({

            if (si.indexOf(KEY) > -1) st.keySeen = true;
            var items = [];
            if (Math.random() < (st.bat < 10 ? 0.12 : 0.03)) { items.push(L('[ link jitter — retransmitting ]', 'w', 300)) }
            items.push(L(si, '', 0));
            return items.concat(progress())
        }
        function run(line) {
            var t = line.trim(); if (!t) return;
            var first = tokenize(t)[0], c = first ? first.toLowerCase() : '';
            if (c === 'clear') { Q.length = 0; out.innerHTML = ''; return }
            if (c === 'skip') { emit(L(prompt() + ' ' + line, 'c')); if (running) { fast = true; emit(L('fast-forwarding buffer...', 'c')) } else emit(L('Nothing to skip.', 'c')); return }
            nCmd++;
            Q.push(L(prompt() + ' ' + line, 'c', 0));
            Q.push(F(function () { return exec(t) }));
            if (!running) pump()
        }

        /* ---------- input ---------- */
        function complete() {
            var v = inp.value, m = v.match(/(\S*)$/), tok = m[1], before = v.slice(0, v.length - tok.length), cands;
            if (!before.trim() || /\|\s*$/.test(before)) { cands = Object.keys(cmds).concat(Object.keys(sc)) }
            else {
                var i = tok.lastIndexOf('/'), dirp = i < 0 ? '.' : (tok.slice(0, i) || '/'), base = tok.slice(i + 1), n = getNode(norm(dirp));
                cands = (n && n.d) ? Object.keys(n.d).filter(function (k) { return k[0] !== '.' || base[0] === '.' }).map(function (k) { return (i < 0 ? '' : tok.slice(0, i + 1)) + k + (n.d[k].d ? '/' : '') }) : []
            }
            var mt = cands.filter(function (c) { return c.indexOf(tok) === 0 });
            if (mt.length === 1) inp.value = before + mt[0] + (mt[0].slice(-1) === '/' ? '' : ' ');
            else if (mt.length > 1) { var p = mt[0]; mt.forEach(function (x) { while (x.indexOf(p) !== 0) p = p.slice(0, -1) }); if (p.length > tok.length) inp.value = before + p }
        }
        inp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { var v = inp.value; if (v.trim()) { hist.push(v); hi = hist.length } run(v); inp.value = '' }
            else if (e.key === 'ArrowUp') { if (hi > 0) { hi--; inp.value = hist[hi] } e.preventDefault() }
            else if (e.key === 'ArrowDown') { if (hi < hist.length - 1) { hi++; inp.value = hist[hi] } else { hi = hist.length; inp.value = '' } e.preventDefault() }
            else if (e.key === 'Tab') { e.preventDefault(); complete() }
        });
        document.addEventListener('click', function (e) { if (e.target !== inp && !window.getSelection().toString()) inp.focus() });
        setLink('SEARCHING'); setBat(2); prEl.textContent = prompt();
        say(boot());

    </script>
