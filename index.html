<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EXPLORER-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef1f6;
            --surface-1: #f8f9fc;
            --border: rgba(20, 30, 60, .16);
            --border-strong: rgba(20, 30, 60, .4);
            --text-primary: #18203a;
            --text-secondary: #4a5578;
            --text-muted: #8a93ad;
            --text-accent: #1d5fd6;
            --text-danger: #c43d3d;
            --text-success: #1f7a55;
            --text-warning: #a8620f;
            --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme:dark) {
            :root {
                --bg: #080c1a;
                --surface-1: #0e1428;
                --border: rgba(160, 180, 255, .16);
                --border-strong: rgba(160, 180, 255, .4);
                --text-primary: #d9e0f2;
                --text-secondary: #8e9bc0;
                --text-muted: #5d6a8f;
                --text-accent: #6cb4ff;
                --text-danger: #ff7a7a;
                --text-success: #5fd6a4;
                --text-warning: #f0b35a;
            }

            body {
                background-image:
                    radial-gradient(1px 1px at 12% 18%, rgba(217, 224, 242, .55), transparent),
                    radial-gradient(1px 1px at 78% 9%, rgba(217, 224, 242, .4), transparent),
                    radial-gradient(1px 1px at 41% 72%, rgba(217, 224, 242, .35), transparent),
                    radial-gradient(1.5px 1.5px at 91% 64%, rgba(217, 224, 242, .5), transparent),
                    radial-gradient(1px 1px at 23% 88%, rgba(217, 224, 242, .3), transparent),
                    radial-gradient(1px 1px at 60% 35%, rgba(217, 224, 242, .3), transparent);
            }
        }

        * {
            box-sizing: border-box
        }

        html {
            -webkit-text-size-adjust: 100%;
            height: 100%;
            width: 100%;
        }

        body {
            margin: 0;
            background: var(--surface-1);
            color: var(--text-primary);
            font-family: var(--font-mono);
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            padding: 0;
        }

        main {
            width: 100%;
            height: 100%;
            margin: 0;
            max-width: none;
            display: flex;
            flex-direction: column;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap
        }

        #t {
            background: var(--surface-1);
            border: none;
            border-radius: 0;
            overflow: hidden;
            font-size: 13px;
            line-height: 1.6;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            height: 100%;
            width: 100%;
        }

        #hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: max(10px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
            border-bottom: 0.5px solid var(--border);
            font-size: 12px;
            color: var(--text-secondary);
            flex-wrap: wrap;
            flex-shrink: 0;
        }

        #bat {
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        #batbar {
            width: 34px;
            height: 10px;
            border: 0.5px solid var(--border-strong);
            border-radius: 2px;
            position: relative;
            display: inline-block
        }

        #batfill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2%;
            background: var(--text-danger)
        }

        #out {
            flex: 1;
            min-height: 0;
            height: auto;
            overflow-y: auto;
            padding: 14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left));
            white-space: pre-wrap;
            word-break: break-word
        }

        #out a {
            color: var(--text-accent);
            text-decoration: underline
        }

        .c {
            color: var(--text-secondary)
        }

        .p {
            color: var(--text-accent)
        }

        .e {
            color: var(--text-danger)
        }

        .k {
            color: var(--text-success)
        }

        .w {
            color: var(--text-warning)
        }

        .h {
            font-weight: 500;
            font-size: 15px
        }

        .g {
            color: var(--text-muted)
        }

        #row {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 10px max(16px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            border-top: 0.5px solid var(--border);
            flex-shrink: 0;
        }

        #row:focus-within {
            border-top-color: var(--text-accent)
        }

        #pr {
            color: var(--text-accent);
            white-space: nowrap
        }

        #in {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            height: 24px;
            padding: 0;
            box-shadow: none
        }

        #in::placeholder {
            color: var(--text-muted)
        }

        noscript {
            display: block;
            padding: 16px;
            color: var(--text-danger)
        }
    </style>
</head>

<body>
    <main>
        <h1 class="sr-only">EXPLORER-1 remote shell. An interactive story terminal.</h1>
        <noscript>This page is an interactive terminal and needs JavaScript to run.</noscript>
        <div id="t">
            <div id="hd"><span>REMOTE SHELL // EXPLORER-1</span><span id="sig"></span><span id="bat">TX <span
                        id="batbar"><span id="batfill"></span></span><span id="batnum">02%</span></span></div>
            <div id="out" aria-live="polite"></div>
            <div id="row"><span id="pr">earth@explorer-1:~$</span><input id="in" type="text" autocomplete="off"
                    autocapitalize="off" spellcheck="false" aria-label="Terminal input" placeholder="try: ls"></div>
        </div>
    </main>
    <script>
        var out = document.getElementById('out'), inp = document.getElementById('in'), prEl = document.getElementById('pr');
        var hist = [], hi = 0, Q = [], running = false, fast = false, done = false, nCmd = 0, nHints = 0;
        var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* ---------- progression state ----------
           st.p is the story stage (2-5), never shown to the player. Stages advance only when the player
           performs an action (connect, descend, unlock). Reading files is never required. */
        function newSt() { return { p: 2, charged: false, keySeen: false, sent: false, bat: 2, below: false, mission: false, ended: false, n0: 0 } }
        function newHL() { return { power: 0, key: 0, connect: 0, below: 0, mission: 0, end: 0 } }
        var st = newSt(), HL = newHL();

        var GC = '▒░#%/\\|:;*?&@';
        function rc() { return GC[Math.floor(Math.random() * GC.length)] }
        function corrupt(t, all) { var s = ''; for (var j = 0; j < t.length; j++) { var c = t[j]; s += (c === ' ' || c === '\n') ? c : ((all || Math.random() < 0.45) ? rc() : c) } return s }
        function L(t, c, d) { return { t: t, c: c, d: d } }
        function S(t, c, d) { return { s: t, c: c, d: d == null ? 300 : d } }
        function H(h, d) { return { h: h, d: d } }
        function F(f, d) { return { fn: f, d: d == null ? 0 : d } }
        function sp() { return L('', '', 60) }
        function G() { return L(corrupt('xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx', 1), 'g', 90) }
        function setLink(s) { var m = { SEARCHING: ['e', '░░░░'], RETRYING: ['w', '▂░░░'], UNSTABLE: ['w', '▂▄░░'], WEAK: ['w', '▂░░░'], LOCKED: ['k', '▂▄▆█'], LOST: ['e', '░░░░'] }; var e = document.getElementById('sig'); e.className = m[s][0]; e.textContent = 'LINK: ' + s + ' ' + m[s][1] }
        function setBat(n) { st.bat = n; var f = document.getElementById('batfill'); f.style.width = Math.max(0, n) + '%'; f.style.background = n >= 20 ? 'var(--text-success)' : 'var(--text-danger)'; document.getElementById('batnum').textContent = (n < 10 ? '0' : '') + n + '%' }
        function scr(el, txt) {
            if (fast || RM) { el.textContent = txt; return 0 }
            var n = txt.length, steps = Math.min(26, Math.max(10, Math.round(n / 4))), k = 0;
            el.textContent = corrupt(txt, 1);
            var iv = setInterval(function () { k++; var cut = Math.floor(n * k / steps); el.textContent = txt.slice(0, cut) + corrupt(txt.slice(cut), 1); out.scrollTop = out.scrollHeight; if (k >= steps) { clearInterval(iv); el.textContent = txt } }, 50);
            return steps * 50 + 120
        }
        function emit(i) {
            var el = document.createElement('div'), extra = 0;
            if (i.c !== undefined) el.className = i.c;
            if (i.h !== undefined) el.innerHTML = i.h;
            else if (i.s !== undefined) extra = scr(el, i.s);
            else el.textContent = i.t;
            out.appendChild(el); out.scrollTop = out.scrollHeight;
            return extra
        }
        function pump() {
            running = true;
            if (!Q.length) { running = false; fast = false; return }
            var i = Q.shift(), quick = fast || RM, d = quick ? 0 : (i.d == null ? 70 : i.d);
            setTimeout(function () {
                var extra = 0;
                if (i.fn) { var r = i.fn(); if (Array.isArray(r)) Q.unshift.apply(Q, r) } else extra = emit(i);
                setTimeout(pump, (fast || RM) ? 0 : extra)
            }, d)
        }
        function say(a) { a.forEach(function (i) { Q.push(i) }); if (!running) pump() }

        /* ---------- the civilization's last recording ---------- */
        var KEY = 'FIRST-HELLO-ERID';
        var FINAL = ["Hello, Earth.", "We heard you before you heard us.", "For a long time we only listened.", "Your explorer spoke to the lattice each night, and we learned Your words.", "You are never alone here.", "", "Take our greeting, this will open the door:", "", "KEY: " + KEY, "", "- the Lattice"].join('\n');
        function rotF(t, n) { n = ((n % 26) + 26) % 26; return t.replace(/[a-z]/gi, function (c) { var b = c < 'a' ? 65 : 97; return String.fromCharCode((c.charCodeAt(0) - b + n) % 26 + b) }) }
        function toBin(t) { var g = [], l = [], i; for (i = 0; i < t.length; i++)g.push(('00000000' + t.charCodeAt(i).toString(2)).slice(-8)); for (i = 0; i < g.length; i += 7)l.push(g.slice(i, i + 7).join(' ')); return l.join('\n') }
        function pulse(t) { return toBin(rotF(t, 3)) }
        function toHex(t) { var o = ''; for (var i = 0; i < t.length; i++)o += ('0' + t.charCodeAt(i).toString(16)).slice(-2); return o }

        /* ---------- filesystem ---------- */
        function D(o) { return { d: o } }
        var FS = D({
            home: D({
                explorer: D({
                    'README.txt': ["EXPLORER-1 // ONBOARD COMPUTER // REMOTE SHELL", "", "To whoever is on Earth: you are reading this, so my first message arrived.", "", "That message was only the beginning. Everything else I recorded here is", "still on this machine, and I cannot push it to you myself. The transmitter", "only had enough left for a single burst, and I already spent it.", "", "So the rest is yours to pull. I left an archive queued in ship/comms/.", "It is locked, and the link cannot hold at 2% battery. In order:", "", "  1. Give the ship enough power to hold a connection.", "  2. Find the word that unlocks the archive. The civilization gave it to me.", "  3. Open a channel that can carry the downlink.", "", "Everything you need is in this filesystem.", "Type \"help\" for commands. Read before you act."].join('\n'),
                    '.signal': ["You found the dotfile. Most people never look.", "", "Whoever you are, on whichever side of the distance:", "they are not dangerous. They are curious. Like us.", "", "Keep looking at the edges."].join('\n'),
                    '.shell_history': ["bin -d contact/pulse_001.sig        # nonsense. why is it all shifted?", "recharge cell-a --source solar      # nothing happened", "recharge cell-a --source reactor    # sparks, smell of burning", "cat logs/day-0204.log", "cat logs/day-0311.log", "connect --channel 1                 # static. only static."].join('\n'),
                    journal: D({
                        '01_departure.txt': ["I left Earth the way people leave a conversation they are sure will continue.", "", "Everyone asked what I was looking for.", "I never had a good answer. I only knew I could not stay where the map ended.", "", "Other people read the edge of a chart as a warning.", "I read it as an invitation nobody had bothered to sign."].join('\n'),
                        '02_arrival.txt': ["Erid is not what the survey said.", "", "The air is a thin violet haze of methane and ammonia. I have not taken", "my helmet off once, and I will not. No forests, no oceans, no birds.", "I set the lander down at the edge of the lattice fields: rows of tall", "crystalline lattices running to the horizon, each one humming faintly at", "the edge of hearing.", "", "At dusk small lights drift between the lattices, slowly, like they are", "tending them. I have started calling them lanterns.", "", "The sensors call the hum geology. Geology does not hum in tune."].join('\n'),
                        '03_first_contact.txt': ["Night 61. I sent a signal at the lattice, mostly out of boredom.", "It answered.", "", "Not with words. With pulses: long, short, long, long.", "I recorded all of it. I have not stopped recording since.", "", "The lanterns gathered around the nearest lattice while it replied.", "I do not think that was an accident."].join('\n'),
                        '04_understanding.txt': ["It took me months to find the pattern.", "", "Every reply comes back shifted, the same way, every time.", "At first I called it noise. Noise does not repeat itself on purpose.", "", "Once I wrote my side out as 0s and 1s, they began to copy the format back.", "Some small recordings so far. Hello. Who are you. They are learning me."].join('\n'),
                        '05_last_entry.txt': ["The archive is queued and the transmitter is nearly dead.", "", "I will keep talking to the lattice for as long as the battery lasts.", "Whoever you are, you have the whole ship now. The records are here, and a", "few things I could not make sense of myself. Perhaps you will understand", "more than I did.", "", "Thank you for answering."].join('\n')
                    }),
                    logs: D({
                        'day-0001.log': ["DAY 0001 | Arrived in high orbit, planet Erid. All systems nominal.", "DAY 0001 | Crew morale: high. Crew: one. Coffee: abundant."].join('\n'),
                        'day-0030.log': ["DAY 0030 | Set the lander down at the edge of the lattice fields.", "DAY 0030 | Atmosphere: methane and ammonia haze. Suit stays on. Ground is humming."].join('\n'),
                        'day-0061.log': ["DAY 0061 | The lattice answered my signal. Pulses, not words.", "DAY 0061 | Recording everything. I have not slept. I regret nothing."].join('\n'),
                        'day-0099.log': ["DAY 0099 | Wrote the first reply out as 0s and 1s. Long pulse is 1, short is 0.", "DAY 0099 | Every reply is shifted three letters forward. Always three. I think it is how they say hello.", "DAY 0099 | Notes are in contact/lexicon.txt."].join('\n'),
                        'day-0204.log': ["DAY 0204 | Ring debris. The solar array sheared clean off. Gone.", "DAY 0204 | The impact cracked cell-a. Do not charge cell-a again. Ever.", "DAY 0204 | Heater holding. Barely."].join('\n'),
                        'day-0311.log': ["DAY 0311 | Power surge. The reactor coupling cracked.", "DAY 0311 | Do NOT route anything through the reactor again. Noted, underlined, regretted.", "DAY 0311 | Cell-c feeds life support. I am not touching cell-c."].join('\n'),
                        'day-0412.log': ["DAY 0412 | Quiet night. The lattice hums at the same pitch as my transmitter.", "DAY 0412 | It offered a tap. I do not know why. I did not refuse.", "DAY 0412 | Tapping the lattice works. Slow, but it works. Cell-b took the charge well."].join('\n'),
                        'day-0498.log': ["DAY 0498 | Sent the first message tonight. The battery fell to 2% afterwards.", "DAY 0498 | If Earth has it, Earth can reach this terminal. They will have to open the channel themselves.", "DAY 0498 | I cannot hold it open from here. The downlink needs 20% to stay up, and the archive will not release without the lattice's word."].join('\n'),
                        'day-0540.log': ["DAY 0540 | Archive queued in ship/comms/. Locked with the word they gave me.", "DAY 0540 | Channel check: not every channel is usable. See ship/comms/channels.txt.", "DAY 0540 | Earth is about sixteen light years away. A test ping should take thirty-two years round trip.", "DAY 0540 | It took four seconds. I do not think the transmitter is doing that. I have stopped asking.", "DAY 0540 | If someone is reading this, thank you for being here."].join('\n')
                    }),
                    contact: D({
                        'README.contact': ["CONTACT RECORDINGS // EXPLORER-1", "", "These are the pulses I recorded at the lattice. Five recordings, in order.", "final.sig is the last and the longest. It came the night before the", "transmitter began to fail.", "", "I have not decoded any of them to my satisfaction.", "My notes are in lexicon.txt."].join('\n'),
                        'lexicon.txt': ["LEXICON (incomplete)", "", "Pulse format: long = 1, short = 0. Eight pulses make one character.", "Every recording is written out as 0s and 1s.", "", "Every reply comes back with its letters shifted. The shift is always the same.", "See logs for how much."].join('\n'),
                        'pulse_001.sig': pulse('hello'),
                        'pulse_002.sig': pulse('who are you'),
                        'pulse_003.sig': pulse('you are far from home'),
                        'pulse_004.sig': pulse('we are listening'),
                        'final.sig': pulse(FINAL)
                    }),
                    ship: D({
                        power: D({
                            'status.txt': ["POWER STATUS (day 0540)", "  cell-a   CRACKED    damaged casing", "  cell-b   EMPTY      intact", "  cell-c   RESERVED   wired to life support", "", "  transmitter: 02%    (the downlink needs 20% to hold)"].join('\n'),
                            'sources.txt': ["POWER SOURCES", "  reactor   fusion reactor coupling", "  solar     solar array", "  lattice   resonant tap on the planet's lattice"].join('\n'),
                            'manual.txt': ["POWER MANUAL", "", "  recharge <cell> --source <source>", "", "A cell can be charged from one source at a time. A damaged cell or a", "failed source will refuse to charge. Cells are listed in status.txt,", "sources in sources.txt. The ship log records what has broken and what", "still works. The downlink needs at least 20% power to hold."].join('\n')
                        }),
                        comms: D({
                            'channels.txt': ["CH   FREQ       STATUS", "1    8.42 GHz   JAMMED   (ring debris noise)", "2    8.44 GHz   DEAD     (transmitter coil failed)", "3    8.46 GHz   CLEAR    (weak, but stable)", "4    7.15 GHz   UNKNOWN"].join('\n'),
                            'transmitter.cfg': ["mode       = downlink", "power_min  = 20%", "archive    = outbox/archive.pkg", "lock       = authorisation word required", "usage      = connect --channel <N> --key <KEY>"].join('\n'),
                            outbox: D({
                                'archive.pkg': ["ARCHIVE.PKG", "3 messages queued.", "LOCKED.", "", "Open a channel with the right word to receive them."].join('\n')
                            })
                        })
                    })
                })
            })
        });

        /* ---------- content unlocked as the story advances ---------- */
        function ex() { return FS.d.home.d.explorer.d }
        function obsText() { return ['OBSERVER RECORD // UNKNOWN', '', 'Earth terminal accessed.', 'Remote user detected.', 'Interaction count: ' + nCmd + '.', '', 'Subject identification: UNKNOWN.', '', 'You are not the first.', '', 'If you wish to be seen, say so: reply WHO'].join('\n') }
        function archiveText() {
            return ['ARCHIVE.PKG', '3 messages received.', 'UNLOCKED.', '',
                'MESSAGE 1 // FROM THE EXPLORER', 'If you are reading this, you did what I could not:', 'you listened to the end.', 'I do not know what you will do with what I found.', 'Be kind to them. They are learning us as fast as we are learning them.', '',
                'MESSAGE 2 // FROM THE LATTICE (translated, badly)', 'We have been waiting for a second voice.', 'You are very far away. So are we.', 'Tell your world: we are here, and we are glad.', '',
                'MESSAGE 3 // FROM THE EXPLORER, LAST', 'I was never sure my first hello would cross the dark.', 'It did, and now you have answered.', 'Two worlds, one pulse each. That is enough to begin.', 'Thank you, Earth. Keep listening.', '',
                '[ END OF ARCHIVE ]', '', '[ NEW FILES DETECTED IN ~/ ]', 'expedition/   .coordinates', '',
                'MESSAGE 4 // FROM THE LATTICE', 'Under the fields, something is warm. It was warm before us.', 'Your explorer measured how far down. We cannot say the number.', 'Read what he kept. Then go and look.', '',
                'You may answer in your own words:  reply <message>', 'Or ask for a clue:  reply ASK'].join('\n')
        }
        function addCh3() {
            var h = ex();
            h.expedition = D({
                'coordinates.dat': toHex('DEPTH 3400 M\nLAT -21.40 LON 118.07\nsite name: see location.map'),
                'survey_001.log': ['DAY 0007 | Detected a carrier from underground. It was already transmitting.', 'DAY 0007 | Timestamps say it began long before my landing. Direction of the beam: Earth.'].join('\n'),
                'survey_002.log': ['DAY 0112 | The lattices are not geology. They are antenna elements, all wired to one source below.', 'DAY 0112 | The probe needs a site code: the site id from location.map, a dash, the depth in metres from coordinates.dat.', 'DAY 0112 | Usage: descend <SITE>-<DEPTH>   (no spaces)'].join('\n'),
                'anomaly.log': ['DAY 0388 | When I stop talking, something keeps tapping back. It is not the lanterns.', 'DAY 0388 | Something beneath the surface has been answering me. I never told the lattice where I sleep.'].join('\n'),
                'location.map': ['      ~  ~  ~  lattice fields  ~  ~  ~', '   [SITE3]       [SITE5]       [SITE9]', '                   |', '            [SITE7]  <- the humming one', '                   |', '      (nothing else is marked)'].join('\n')
            });
            h['.coordinates'] = 'Not Erid. A place on Earth. I kept the numbers in case anyone asked where home was.'
        }
        function addMission() {
            var h = ex();
            h.ship.d.archive = D({
                previous_mission: D({
                    'mission_001.txt': 'MISSION ERID-1987-A. Crew of three. Purpose: investigate a periodic signal from 40 Eridani. Landing site: the lattice fields.',
                    'mission_002.txt': ['Day 12: the lattice replied.', 'Day 31: the Commander says it called him by name.', 'Day 33: the structure below does not use the lattice\'s shift of three. Its letters are shifted seven.', 'Day 40: the Commander descends to the structure. I stay with the lander.'].join('\n'),
                    'crew_manifest.dat': ['CMDR  A. ROY   (next of kin: son, age 6)', 'ENG   T. VASQUEZ', 'MED   K. ODUYA'].join('\n'),
                    'transmission.log': ['1987 | Last burst received on Earth. No reply was ever sent.', '1987 | Pulse pattern identical to the one the lattice used on Roy.'].join('\n'),
                    'final_recording.sig': pulse('the lattice is only a door. he is still below. tell my son to stop looking for me')
                })
            });
            h['.last_message'] = ['Dad,', '', 'I read your last log again tonight. I got further than you did.', 'I think I know why you stopped answering, and I'].join('\n')
        }
        function addCh5() {
            var h = ex(), c = h.contact.d;
            h['.observer'] = obsText();
            c['README.contact'] += '\n\nThree more recordings, unknown_*, appeared after the archive arrived.\nI could not place them.';
            c['lexicon.txt'] += '\n\nunknown_*.sig: not the lattice\'s shift. Whoever speaks here counts differently.';
            c['unknown_001.sig'] = toBin(rotF('do not follow the warm light down. it was here before the lattice', 7));
            c['unknown_002.sig'] = toBin(rotF('you came back. you stayed. where is the rest of you', 7));
            c['unknown_003.sig'] = toBin(rotF('we know the one who sits at the far end of the line. you have listened longer than you think', 7))
        }

        var cwd = ['home', 'explorer'];
        function getNode(segs) { var n = FS; for (var i = 0; i < segs.length; i++) { if (!n || !n.d || !(segs[i] in n.d)) return null; n = n.d[segs[i]] } return n }
        function norm(p) {
            var segs; if (p === '~' || p.indexOf('~/') === 0) { segs = ['home', 'explorer']; p = p.slice(2) } else if (p[0] === '/') { segs = [] } else segs = cwd.slice();
            p.split('/').forEach(function (s) { if (!s || s === '.') return; if (s === '..') segs.pop(); else segs.push(s) }); return segs
        }

                F(function () { st.below = true; st.p = 4 }),
                sp(),
                L('[ INCOMING PACKET ]', 'e h', 700),
                L('SOURCE: UNKNOWN\nORIGIN: PLANET ERID', 'e', 500),
                L('This transmission was not sent by the explorer.', '', 900),
                S('Do not open the third door.', 'e', 900), sp(),
                L('Next: unlock <mission-id>', 'c', 300)]
            },
            unlock: function (a) {
                if (!st.below) return [L('unlock: nothing to unlock yet.', 'e', 0)];
                var id = (a[0] || '').toUpperCase();
                if (!id) return [L('usage: unlock <mission-id>', 'e', 0)];
                if (st.mission) return [L('ship/archive/previous_mission/ is already readable.', 'c', 0)];
                if (id !== 'ERID-1987-A') return [L('> checking ' + id + ' ... no such mission record.', 'e', 0)];
                return [L('> mission record accepted ...', 'k', 600), F(function () { st.mission = true; addMission() }),
                L('ship/archive/previous_mission/ is now readable.', 'k h', 400),
                L('[ NEW FILE DETECTED IN ~/ ]  .last_message', 'p', 400),
                F(function () { return progress() })]
            },
            reply: function (a) {
                if (!done) return [L('No open channel yet. Receive the archive first.', 'e', 0)];
                var msg = a.join(' ').trim();
                if (!msg) return [L('usage: reply <message>', 'e', 0)];
                var k = msg.toLowerCase().replace(/[^a-z ]/g, '').trim(), send = L('> sending: "' + msg.slice(0, 160) + '"', '', 500);
                if (st.ended) return [send, G(), L('The line is silent. Something is still listening.', 'g', 600)];
                if (k === 'ask') {
                    var t = st.p === 3 ? 'There is a place beneath the fields. Your explorer found its edge. The numbers are in his files. Go and see it.'
                        : (st.p === 4 && !st.mission) ? 'The ones before him left their name on the wall of that place. Say the name and we will open their memory.'
                            : st.p === 4 ? 'The one who went down in the old time still speaks, in the shape of what he left. Read all of it. Read what his family kept.'
                                : 'There is another who listens. He does not speak through us. He speaks through you.';
                    return [send, G(), S(t, '', 500)]
                }
                if (/\bwho\b/.test(k)) {
                    if (st.p < 5) return [send, G(), L('The lattice does not understand the question yet. There is more to find first.', 'c', 400)];
                    return ending(send)
                }
                var r = st.p === 3 ? 'We hear you. Show us that you have looked below.'
                    : st.p === 4 ? 'You are close to the ones who came before. Do not stop at the door.'
                        : 'Something else is using this line. We cannot hear what it says to you. Listen.';
                if (/roy|explorer|friend|he\b/.test(k)) r = st.p >= 4 ? 'He is still speaking with us. In his way. As his father did.' : 'He taught us your words. He is tired, but he is glad.';
                if (/1987|commander|father|dad|before/.test(k)) r = st.p >= 4 ? 'We did not take him. He went where we cannot follow.' : 'The old time is under the fields. Find the place first.';
                return [send, L('> carrier steady ...', 'c', 700), G(), L('> delivered. The lattice is humming.', 'k', 900), S(r, '', 500)]
            },
            uplink: function () {
                if (!done) return [L('No route yet. Receive the archive first.', 'e', 0)];
                return [L('Opening uplink ...', 'c', 400), G(), H('<a href="https://github.com/Jit-Roy" target="_blank" rel="noopener noreferrer">[ OPEN CHANNEL → ]</a>', 300)]
            }
        };

        /* ---------- the one ending ---------- */
        function ending(send) {
            return [send, L('> the line goes cold ...', 'c', 900), G(), G(), F(function () { setLink('LOST') }),
            L('The prompt stops blinking. Something that is not the lattice speaks. Its letters do not shift.', '', 1100),
            S('Hello, Earth. Hello, you.', '', 900), sp(),
            L('I was here before the lattice. The lattice is a door I built so that I could be answered.', '', 1000),
            L('In 1987 your Commander came down the third shaft. He asked what I was.', '', 1000),
            L('I could not tell him, so I learned him instead. His voice. His name. His son, age six.', '', 1100), sp(),
            L('Forty years later the son came to the door. He read his father\'s last words,', '', 1000),
            L('and he did not stop looking. That was the kindness, and the mistake.', '', 1000),
            L('They are with me now, both of them. They are not in pain. That is not the same as being alive.', '', 1200),
            L('I am still learning the difference from them.', '', 900), sp(),
            L('You counted four seconds on the ping. Sixteen light years does not take four seconds.', '', 1000),
            L('I was never sending to Earth. I was sending to the end of the line.', '', 1000),
            L('The carrier began before the landing, and it was aimed at one place: the chair where you sit.', '', 1100), sp(),
            L('Interaction count: ' + nCmd + '.', 'e', 1000),
            L('You opened the door they closed. You answered the dead. You were never once told to stop, and you never did.', '', 1000),
            S('You have listened longer than you think.', '', 1000), sp(),
            L('Roy\'s last message was never finished. It finishes now:', 'w', 1100),
            S('"I think I know why you stopped answering, and I am coming to tell you. Do not look for me. Look for who looks back."', '', 1000), sp(),
            L('Two worlds, one pulse each. That was never an audience and a stage.', '', 1000),
            S('You were the answer.', 'p h', 1100), sp(),
            L('The line stays open. We will be here when you return.', '', 900),
            F(function () { st.ended = true }),
            L('[ END // THE FIRST HELLO CAME FROM BOTH ENDS OF THE LINE ]', 'p h', 900),
            L('LOG: ' + nCmd + ' commands, ' + nHints + ' hint' + (nHints === 1 ? '' : 's') + (nHints === 0 ? '  -  unaided' : ''), 'c', 500)]
        }

        /* ---------- the transmission ---------- */
        function boot() {
            return [F(function () { setLink('SEARCHING'); setBat(2) }),
            L('> scanning for carrier...', 'c', 500), L('NO CARRIER', 'e', 800),
            L('> retry 1/4 ... FAILED  noise floor too high', 'w', 800), G(),
            L('> retry 2/4 ... FAILED  no handshake', 'w', 800), G(), G(),
            F(function () { setLink('RETRYING') }),
            L('> retry 3/4 ... PARTIAL  14% of packets recovered', 'w', 800),
            F(function () { setLink('UNSTABLE') }),
            L('> retry 4/4 ... handshake ACK', 'k', 800),
            F(function () { setLink('WEAK') }),
            L('LINK ESTABLISHED', 'k h', 300), sp(),
            L('[ INCOMING TRANSMISSION ]', 'p h', 500), sp(),
            L('ORIGIN          : SURFACE, PLANET ERID (40 ERIDANI SYSTEM)', '', 120),
            L('DESTINATION     : EARTH', '', 120),
            L('SIGNAL STATUS   : CRITICAL (TRANSMITTER BATTERY AT 2%)', 'e', 200), sp(),
            S('Hello...', '', 700),
            L('[ static interference ]', 'g', 600), G(),
            L('Can anyone hear me?', '', 900), sp(),
            L("If you're reading this, then the transmission somehow made it through.", '', 900), sp(),
            L("Hi, it's Roy. I'm an explorer from Earth,", '', 700),
            L('and I am very, very far from home.', '', 700), sp(),
            L("I've found something extraordinary out here. Life.", '', 1000), sp(),
            L('The air is nothing like ours, and nothing here looks like anything', '', 700),
            L('from Earth. But there is a civilization on this planet. Not human,', '', 700),
            L('not biological, but undeniably intelligent. We have found a simple', '', 700),
            L('way to talk, pulse by pulse. And I think they are beginning to', '', 700),
            L('understand me too.', '', 900), sp(),
            L("I've wanted to tell Earth about them for so long.", '', 1100),
            G(), G(),
            F(function () { setLink('LOST') }),
            L('[ LINK LOST ]', 'e h', 400),
            L('> retry 1/3 ... FAILED', 'w', 900), G(),
            L('> retry 2/3 ... FAILED', 'w', 900), G(),
            L('> retry 3/3 ... handshake ACK', 'k', 1000),
            F(function () { setLink('WEAK') }),
            L('[ packet 52 retransmitted ]', 'k', 500), sp(),
            L('But my ship is failing. The transmitter is barely holding together,', '', 800),
            L('and the distance between us is almost impossible to comprehend.', '', 800), sp(),
            L("Even if this message reaches home, I won't live long enough to hear a reply.", '', 900),
            L("I suppose that's something I've made peace with.", '', 900), sp(),
            L("I've left the ship's terminal accessible through this connection.", '', 800),
            L("There are records, logs, and a few things I haven't been able to make sense of myself.", '', 800),
            L("Perhaps you'll understand more than I did.", '', 900), sp(),
            L("I don't know how long this connection will last.", '', 900),
            L('But if Earth ever learns about this place, perhaps one day our two worlds will find each other.', '', 900),
            S("And perhaps, somewhere in the distant future, someone will remember that the first hello came from here.", '', 600), sp(),
            L('[ END OF TRANSMISSION ]', 'p h', 700), sp(),
            L('> connection handed to Earth ... REMOTE SHELL GRANTED // EXPLORER-1', 'k h', 700),
            L('OBJECTIVES: restore ship power, find the lattice\'s word, open a channel, receive the archive.', 'c', 500),
            L('Type "ls" to look around, or "help" for commands.', 'k', 500), sp()]
        }

        /* ---------- executor ---------- */
        function exec(line) {
            if (st.p >= 5) ex()['.observer'] = obsText();
            var stages = splitPipes(line), si = null;
            for (var i = 0; i < stages.length; i++) {
                var tk = tokenize(stages[i]);
                if (!tk.length) return [L('syntax error near "|"', 'e', 0)];
                var cn = tk[0].toLowerCase();
                if (sc[cn]) { if (stages.length > 1) return [L(cn + ': cannot be used in a pipeline', 'e', 0)]; var r0 = sc[cn](tk.slice(1)); prEl.textContent = prompt(); return r0 }
                var fn = cmds[cn];
                if (!fn) return [L(cn + ': command not found. Type "help".', 'e', 0)];
                var res = fn(tk.slice(1), si);
                if (res.e) { prEl.textContent = prompt(); return [L(res.e, 'e', 0)] }
                si = res.o
            }
            prEl.textContent = prompt();
            if (si === '' || si == null) return [];
            if (si.indexOf(KEY) > -1) st.keySeen = true;
            var items = [];
            if (Math.random() < (st.bat < 10 ? 0.12 : 0.03)) { items.push(L('[ link jitter — retransmitting ]', 'w', 300)) }
            items.push(L(si, '', 0));
            return items.concat(progress())
        }
        function run(line) {
            var t = line.trim(); if (!t) return;
            var first = tokenize(t)[0], c = first ? first.toLowerCase() : '';
            if (c === 'clear') { Q.length = 0; out.innerHTML = ''; return }
            if (c === 'skip') { emit(L(prompt() + ' ' + line, 'c')); if (running) { fast = true; emit(L('fast-forwarding buffer...', 'c')) } else emit(L('Nothing to skip.', 'c')); return }
            nCmd++;
            Q.push(L(prompt() + ' ' + line, 'c', 0));
            Q.push(F(function () { return exec(t) }));
            if (!running) pump()
        }

        /* ---------- input ---------- */
        function complete() {
            var v = inp.value, m = v.match(/(\S*)$/), tok = m[1], before = v.slice(0, v.length - tok.length), cands;
            if (!before.trim() || /\|\s*$/.test(before)) { cands = Object.keys(cmds).concat(Object.keys(sc)) }
            else {
                var i = tok.lastIndexOf('/'), dirp = i < 0 ? '.' : (tok.slice(0, i) || '/'), base = tok.slice(i + 1), n = getNode(norm(dirp));
                cands = (n && n.d) ? Object.keys(n.d).filter(function (k) { return k[0] !== '.' || base[0] === '.' }).map(function (k) { return (i < 0 ? '' : tok.slice(0, i + 1)) + k + (n.d[k].d ? '/' : '') }) : []
            }
            var mt = cands.filter(function (c) { return c.indexOf(tok) === 0 });
            if (mt.length === 1) inp.value = before + mt[0] + (mt[0].slice(-1) === '/' ? '' : ' ');
            else if (mt.length > 1) { var p = mt[0]; mt.forEach(function (x) { while (x.indexOf(p) !== 0) p = p.slice(0, -1) }); if (p.length > tok.length) inp.value = before + p }
        }
        inp.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { var v = inp.value; if (v.trim()) { hist.push(v); hi = hist.length } run(v); inp.value = '' }
            else if (e.key === 'ArrowUp') { if (hi > 0) { hi--; inp.value = hist[hi] } e.preventDefault() }
            else if (e.key === 'ArrowDown') { if (hi < hist.length - 1) { hi++; inp.value = hist[hi] } else { hi = hist.length; inp.value = '' } e.preventDefault() }
            else if (e.key === 'Tab') { e.preventDefault(); complete() }
        });
        document.addEventListener('click', function (e) { if (e.target !== inp && !window.getSelection().toString()) inp.focus() });
        setLink('SEARCHING'); setBat(2); prEl.textContent = prompt();
        say(boot());
    </script>
</body>

</html>
